<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — Moviez</title>
<link rel="stylesheet" href="../frontend/css/style.css" />
<style>
  .tabs { display: flex; gap: 10px; margin: 24px 0 12px; }
  .tab-btn {
    background: #1c1c1c; border: 1px solid #2a2a2a; color: #ccc;
    padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; width: auto;
  }
  .tab-btn.active { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 700; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin: 20px 0; }
  .stat-card { background: var(--card); border: 1px solid #2a2a2a; border-radius: 10px; padding: 18px; }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--gold); }
  .stat-card .label { font-size: 12px; color: #999; margin-top: 4px; }
  .movie-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #262626; }
  .movie-row img { width: 50px; height: 75px; object-fit: cover; border-radius: 4px; background: #222; }
  .movie-row .grow { flex: 1; }
  .del-btn { width: auto; background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 14px; font-size: 12px; }
</style>
</head>
<body>
<header class="topbar">
  <a href="#" class="logo">MOVIE<span>Z</span> <small style="font-size:12px;color:#888;">ADMIN</small></a>
  <nav>
    <a href="#" id="logoutBtn" class="link">Log Out</a>
  </nav>
</header>

<div class="container">
  <h1>Admin Dashboard</h1>
  <div id="guard" class="msg error" style="display:none;">You don't have access to this page. <a href="../frontend/login.html" class="link">Log in as admin</a></div>

  <div id="mainContent" style="display:none;">
    <div class="stat-cards" id="statCards"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">+ Add New Movie</button>
      <button class="tab-btn" data-tab="movies">All Movies</button>
      <button class="tab-btn" data-tab="users">Users</button>
    </div>

    <div class="tab-content active" id="tab-upload">
      <form id="uploadForm" class="card-form" style="margin:0;max-width:480px;">
        <div id="uploadMsg" class="msg" style="display:none;"></div>
        <label>Movie Title</label>
        <input type="text" id="title" required />

        <label>Description</label>
        <textarea id="description" rows="3"></textarea>

        <label>Price (TZS)</label>
        <input type="number" id="price" min="0" step="100" required />

        <label>Poster Image</label>
        <input type="file" id="poster" accept="image/*" />

        <label>Movie File (video)</label>
        <input type="file" id="video" accept="video/*" required />

        <button type="submit">Upload Movie</button>
      </form>
    </div>

    <div class="tab-content" id="tab-movies">
      <div id="moviesList"></div>
    </div>

    <div class="tab-content" id="tab-users">
      <table>
        <thead><tr><th>Email</th><th>Joined</th><th>Role</th><th>Movies Purchased</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../frontend/js/config.js"></script>
<script src="../frontend/js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
