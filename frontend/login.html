<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — Moviez</title>
<link rel="stylesheet" href="css/style.css" />

<!-- Supabase SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="logo">MOVIE<span>Z</span></a>
  <nav id="nav"></nav>
</header>

<div class="container">
  <form class="card-form" id="loginForm">
    <h2>Log In</h2>
    <div id="msg" class="msg" style="display:none;"></div>

    <label for="email">Email</label>
    <input type="email" id="email" required />

    <label for="password">Password</label>
    <input type="password" id="password" required />

    <button type="submit">Log In</button>
    <p style="text-align:center;margin-top:16px;">
      Don't have an account? <a class="link" href="register.html">Sign up here</a>
    </p>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
renderNav();

// Anzisha Supabase Client
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('loginForm');
const msgEl = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    // 1. Tumia Supabase Auth ku-login
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMsg(msgEl, error.message);
      return;
    }

    // 2. Chukua Maelezo ya Role kutoka Supabase Table ya 'users' au App Metadata
    let role = 'user';
    const { data: userProfile } = await supabase
      .from('users')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (userProfile && userProfile.role) {
      role = userProfile.role;
    }

    const userData = {
      id: data.user.id,
      email: data.user.email,
      role: role
    };

    // 3. Hifadhi Session na Elekeza Mtumiaji Ukurasa Sahihi
    setAuth(data.session.access_token, userData);
    window.location.href = role === 'admin' ? 'admin.html' : 'index.html';

  } catch (err) {
    showMsg(msgEl, err.message);
  }
});
</script>
</body>
</html>
