<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Moviez</title>
<link rel="stylesheet" href="css/style.css" />

<!-- Supabase SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="logo">MOVIE<span>Z</span></a>
  <nav id="nav"></nav>
</header>

<div class="container">
  <form class="card-form" id="registerForm">
    <h2>Sign Up</h2>
    <div id="msg" class="msg" style="display:none;"></div>

    <label for="email">Email</label>
    <input type="email" id="email" required />

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="8" />
    <div style="font-size:12px;color:#888;margin-top:-12px;margin-bottom:16px;">
      At least 8 characters, one uppercase letter, and one number.
    </div>

    <button type="submit">Sign Up</button>
    <p style="text-align:center;margin-top:16px;">
      Already have an account? <a class="link" href="login.html">Log in here</a>
    </p>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
renderNav();

// Anzisha Supabase client
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('registerForm');
const msgEl = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    // Kutumia Supabase Auth moja kwa moja badala ya Express API
    const { data, error } = await supabase.auth.signUp({
      email,
      password
    });

    if (error) {
      showMsg(msgEl, error.message);
      return;
    }

    if (data.session) {
      setAuth(data.session.access_token, data.user);
      window.location.href = 'index.html';
    } else {
      showMsg(msgEl, 'Account created! Check your email for confirmation.', 'success');
    }

  } catch (err) {
    showMsg(msgEl, err.message);
  }
});
</script>
</body>
</html>
