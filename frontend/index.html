<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moviez — Movies. Anytime. Anywhere.</title>
<link rel="stylesheet" href="css/style.css" />

<!-- 1. WEKA SUPABASE SDK HAPA -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="logo">MOVIE<span>Z</span></a>
  <nav id="nav"></nav>
</header>

<div class="container">
  <h1>Browse Movies</h1>
  <div class="tagline">Movies. Anytime. Anywhere.</div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty-state" style="display:none;">No movies yet. Check back soon.</div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
renderNav();

// Anzisha Supabase client
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadMovies() {
  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  
  try {
    // Chukua movies moja kwa moja kutoka Supabase Database Table
    const { data: movies, error } = await supabase
      .from('movies')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!movies || movies.length === 0) {
      emptyEl.style.display = 'block';
      grid.innerHTML = '';
      return;
    }

    emptyEl.style.display = 'none';
    grid.innerHTML = movies.map(m => `
      <a class="movie-card" href="movie.html?id=${m.id}">
        <img src="${m.poster_path ? m.poster_path : 'https://via.placeholder.com/300x450?text=' + encodeURIComponent(m.title)}" alt="${m.title}" />
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="price">TZS ${Number(m.price || 0).toLocaleString()}</div>
        </div>
      </a>
    `).join('');

  } catch (err) {
    grid.innerHTML = `<p style="color:#e05252">${err.message}</p>`;
  }
}

loadMovies();
</script>
</body>
</html>
